    guidance: "List the pods that do not turn the token off in the pod spec: kubectl get pods -A -o json | jq -r '.items[] | select(.spec.automountServiceAccountToken != false) | .metadata.namespace + \"/\" + .metadata.name'. For workloads that do not call the Kubernetes API, set automountServiceAccountToken: false in the pod template or in their service account."
