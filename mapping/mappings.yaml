version: 1
entries:
  - scanner: prowler
    check_id: s3_bucket_level_public_access_block
    title: S3 bucket without Block Public Access
    articles: ["NIS2 Art.21(2)(i)", "NIS2 Art.21(2)(g)", "DORA Art.9", "ISO27001:2022 A.8.3"]
    templates: ["terraform/s3_public_access_block.tf"]
  - scanner: prowler
    check_id: s3_bucket_public_access
    title: S3 bucket publicly accessible
    articles: ["NIS2 Art.21(2)(i)", "NIS2 Art.21(2)(g)", "DORA Art.9", "ISO27001:2022 A.8.3"]
    templates: ["terraform/s3_public_access_block.tf"]
  - scanner: prowler
    check_id: s3_bucket_public_list_acl
    title: S3 bucket publicly listable through ACL
    articles: ["NIS2 Art.21(2)(i)", "NIS2 Art.21(2)(g)", "DORA Art.9", "ISO27001:2022 A.8.3"]
    templates: ["terraform/s3_public_access_block.tf"]
  - scanner: prowler
    check_id: s3_bucket_default_encryption
    title: S3 bucket without default encryption (check deprecated in current Prowler)
    articles: ["NIS2 Art.21(2)(h)", "DORA Art.9", "ISO27001:2022 A.8.24"]
    templates: ["terraform/s3_encryption.tf"]
  - scanner: prowler
    check_id: s3_bucket_kms_encryption
    title: S3 bucket without SSE-KMS default encryption
    articles: ["NIS2 Art.21(2)(h)", "DORA Art.9", "ISO27001:2022 A.8.24"]
    templates: ["terraform/s3_encryption_kms.tf"]
    shared_templates: ["terraform/variables_kms_key.tf"]
  - scanner: prowler
    check_id: ec2_securitygroup_allow_ingress_from_internet_to_any_port
    title: Security group open to the internet on any port
    articles: ["NIS2 Art.21(2)(i)", "NIS2 Art.21(2)(g)", "DORA Art.9", "ISO27001:2022 A.8.20"]
    templates: ["terraform/sg_restrict_ingress.tf"]
    shared_templates: ["terraform/variables_sg_ingress.tf"]
  - scanner: prowler
    check_id: ec2_securitygroup_allow_ingress_from_internet_to_all_ports
    title: Security group open to the internet on all ports
    articles: ["NIS2 Art.21(2)(i)", "NIS2 Art.21(2)(g)", "DORA Art.9", "ISO27001:2022 A.8.20"]
    templates: ["terraform/sg_restrict_ingress.tf"]
    shared_templates: ["terraform/variables_sg_ingress.tf"]
  - scanner: prowler
    check_id: ec2_securitygroup_allow_ingress_from_internet_to_tcp_port_22
    title: Security group open to the internet on SSH (port 22)
    articles: ["NIS2 Art.21(2)(i)", "NIS2 Art.21(2)(g)", "DORA Art.9", "ISO27001:2022 A.8.20"]
    templates: ["terraform/sg_restrict_ingress.tf"]
    shared_templates: ["terraform/variables_sg_ingress.tf"]
  - scanner: prowler
    check_id: ec2_securitygroup_allow_ingress_from_internet_to_tcp_port_3389
    title: Security group open to the internet on RDP (port 3389)
    articles: ["NIS2 Art.21(2)(i)", "NIS2 Art.21(2)(g)", "DORA Art.9", "ISO27001:2022 A.8.20"]
    templates: ["terraform/sg_restrict_ingress.tf"]
    shared_templates: ["terraform/variables_sg_ingress.tf"]
  - scanner: prowler
    check_id: ec2_securitygroup_allow_ingress_from_internet_to_high_risk_tcp_ports
    title: Security group open to the internet on high-risk TCP ports
    articles: ["NIS2 Art.21(2)(i)", "NIS2 Art.21(2)(g)", "DORA Art.9", "ISO27001:2022 A.8.20"]
    templates: ["terraform/sg_restrict_ingress.tf"]
    shared_templates: ["terraform/variables_sg_ingress.tf"]
  - scanner: prowler
    check_id: s3_bucket_public_write_acl
    title: S3 bucket ACL grants public write access
    articles: ["NIS2 Art.21(2)(i)", "NIS2 Art.21(2)(g)", "DORA Art.9", "ISO27001:2022 A.8.3"]
    templates: ["terraform/s3_public_access_block.tf"]
  - scanner: prowler
    check_id: s3_bucket_policy_public_write_access
    title: S3 bucket policy allows public write access
    articles: ["NIS2 Art.21(2)(i)", "NIS2 Art.21(2)(g)", "DORA Art.9", "ISO27001:2022 A.8.3"]
    templates: ["terraform/s3_public_access_block.tf"]
  - scanner: prowler
    check_id: eks_cluster_not_publicly_accessible
    title: EKS API server endpoint open to the internet
    articles: ["NIS2 Art.21(2)(i)", "NIS2 Art.21(2)(g)", "DORA Art.9", "ISO27001:2022 A.8.20"]
    guidance: "Change the existing aws_eks_cluster vpc_config: set endpoint_public_access = false and endpoint_private_access = true, or limit public_access_cidrs to admin ranges. Confirm private connectivity (VPN, Direct Connect or bastion) first, or kubectl access is lost."
  - scanner: kube-bench
    benchmark_ids:
      cis-1.6: "5.2.1"
      cis-1.8: "5.2.2"
      cis-1.10: "5.2.2"
      eks-1.2.0: "4.2.1"
    title: Privileged containers may be admitted
    articles: ["NIS2 Art.21(2)(i)", "NIS2 Art.21(2)(g)", "DORA Art.9", "ISO27001:2022 A.8.2"]
    shared_templates: ["kyverno/block_privileged.yaml"]
  - scanner: kube-bench
    benchmark_ids:
      cis-1.6: "5.2.4"
      cis-1.8: "5.2.5"
      cis-1.10: "5.2.5"
      eks-1.2.0: "4.2.4"
    title: Containers may share the host network namespace
    articles: ["NIS2 Art.21(2)(i)", "NIS2 Art.21(2)(g)", "DORA Art.9", "ISO27001:2022 A.8.22"]
    shared_templates: ["kyverno/block_hostnet.yaml"]
  - scanner: kube-bench
    benchmark_ids:
      cis-1.6: "5.2.6"
      cis-1.8: "5.2.7"
      cis-1.10: "5.2.7"
      eks-1.2.0: "4.2.6"
    title: Root containers may be admitted
    articles: ["NIS2 Art.21(2)(i)", "NIS2 Art.21(2)(g)", "DORA Art.9", "ISO27001:2022 A.8.2"]
    shared_templates: ["kyverno/require_nonroot.yaml"]
