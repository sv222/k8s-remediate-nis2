    title: Kubelet accepts anonymous requests
    articles: ["NIS2 Art.21(2)(i)", "NIS2 Art.21(2)(g)", "DORA Art.9", "ISO27001:2022 A.8.5", "ISO27001:2022 A.8.9"]
    guidance: "No code is generated: the kubelet config belongs to the node image of a managed node group, not to your Terraform. First check the node, because kube-bench also reports FAIL when it cannot read the kubelet config file. The kubelet config needs authentication.anonymous.enabled: false (flag --anonymous-auth=false). Managed node images set this by default, so a FAIL usually means a custom or old node image. EKS: fix the custom AMI, or set it in the nodeadm NodeConfig (spec.kubelet.config) of the launch template, then roll the node group. AKS and GKE do not expose this setting: upgrade the node pool to a current node image (az aks nodepool upgrade --node-image-only, gcloud container clusters upgrade CLUSTER --node-pool POOL). Then re-scan."
    caution: "Rolling a node group or upgrading a node pool drains and replaces its nodes."
