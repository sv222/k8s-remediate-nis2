    title: Privileged containers may be admitted
    articles: ["NIS2 Art.21(2)(i)", "NIS2 Art.21(2)(g)", "DORA Art.9", "DORA RTS 2024/1774 Art.11", "NIS2 CIR 2024/2690 Annex 6.3", "ISO27001:2022 A.8.9"]
    shared_templates: ["kyverno/block_privileged.yaml"]
    follow_up: "The policy starts in Audit mode and blocks nothing. It is not applied to any cluster and existing pods are not changed. Review the policy reports, then set validationActions to Deny to block privileged containers."
