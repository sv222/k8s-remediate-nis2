    title: cluster-admin is bound more than needed
    articles: ["NIS2 Art.21(2)(i)", "DORA Art.9", "ISO27001:2022 A.8.2"]
    guidance: "No code is generated: removing a binding can lock out people or break controllers. List the cluster-admin bindings: kubectl get clusterrolebindings -o json | jq -r '.items[] | select(.roleRef.name==\"cluster-admin\") | .metadata.name + \": \" + ([.subjects[]? | .kind + \"/\" + .name] | join(\", \"))'. Keep the system: bindings of the provider. For each other subject, bind a narrower role, then remove the old binding: kubectl delete clusterrolebinding NAME. On EKS also check access entries with AmazonEKSClusterAdminPolicy (aws eks list-access-entries --cluster-name CLUSTER)."
