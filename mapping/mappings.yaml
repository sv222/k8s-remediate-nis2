    title: Default service accounts are used
    articles: ["NIS2 Art.21(2)(i)", "DORA Art.9", "ISO27001:2022 A.5.15"]
    guidance: "Give each workload that calls the Kubernetes API its own service account. Then stop the token of the default service account in each namespace: kubectl patch serviceaccount default -n NAMESPACE -p '{\"automountServiceAccountToken\": false}'. Remove RoleBindings and ClusterRoleBindings that grant rights to a default service account."
    caution: "Pods that still use the default service account lose API access when they restart."
