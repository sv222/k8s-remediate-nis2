name: E2E

on:
  workflow_dispatch:
  schedule:
    - cron: "23 4 * * 1"

permissions:
  contents: read

jobs:
  aws-emulator:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4.2.2
      - name: Run the end-to-end test
        run: make e2e
        env:
          E2E_KEEP: "1"
      - name: Upload report and logs
        if: always()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: e2e-report
          path: |
            temp/e2e/report.md
            temp/e2e/scans/*.log
            temp/e2e/plan2.log
          if-no-files-found: ignore
