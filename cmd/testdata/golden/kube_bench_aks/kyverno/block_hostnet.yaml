# NIS2/DORA remediation: disallow hostNetwork pods (CIS Kubernetes pod security).
# Needs Kyverno 1.17 or later. Starts in Audit mode. Review the policy reports, then change validationActions to Deny.
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: nis2-block-hostnetwork
  annotations:
    policies.kyverno.io/title: Disallow host network
    policies.kyverno.io/category: Pod Security Standards (Baseline)
    policies.kyverno.io/severity: medium
spec:
  validationActions: [Audit]
  evaluation:
    background:
      enabled: true
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["pods"]
  matchConditions:
    - name: skip-system-namespaces
      expression: "!(object.metadata.namespace in ['kube-system', 'kube-public', 'kube-node-lease', 'kyverno'])"
  validations:
    - expression: "object.spec.?hostNetwork.orValue(false) == false"
      message: "hostNetwork pods are prohibited"
