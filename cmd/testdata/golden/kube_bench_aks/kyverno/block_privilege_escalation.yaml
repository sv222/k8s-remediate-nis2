# NIS2/DORA remediation: disallow containers with allowPrivilegeEscalation: true (CIS Kubernetes pod security).
# Needs Kyverno 1.17 or later.
# The pods/ephemeralcontainers rule also covers kubectl debug.
# Starts in Audit mode. Review the policy reports, then change validationActions to Deny.
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: nis2-block-privilege-escalation
  annotations:
    policies.kyverno.io/title: Disallow privilege escalation
    policies.kyverno.io/category: Pod Security Standards (Restricted)
    policies.kyverno.io/severity: medium
spec:
  validationActions: [Audit]
  evaluation:
    background:
      enabled: true
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["pods"]
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["UPDATE"]
        resources: ["pods/ephemeralcontainers"]
  matchConditions:
    - name: skip-system-namespaces
      expression: "!(object.metadata.namespace in ['kube-system', 'kube-public', 'kube-node-lease', 'kyverno'])"
  variables:
    - name: initContainers
      expression: "object.spec.?initContainers.orValue([])"
    - name: ephemeralContainers
      expression: "object.spec.?ephemeralContainers.orValue([])"
  validations:
    - expression: >-
        object.spec.containers.all(c, c.?securityContext.?allowPrivilegeEscalation.orValue(false) == false) &&
        variables.initContainers.all(c, c.?securityContext.?allowPrivilegeEscalation.orValue(false) == false) &&
        variables.ephemeralContainers.all(c, c.?securityContext.?allowPrivilegeEscalation.orValue(false) == false)
      message: "allowPrivilegeEscalation: true is prohibited"
