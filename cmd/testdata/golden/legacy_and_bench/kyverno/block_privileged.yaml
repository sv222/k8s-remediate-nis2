# NIS2/DORA remediation: disallow privileged containers (CIS Kubernetes pod security).
# Starts in Audit mode. Review the policy reports, then change validationFailureAction to Enforce.
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: nis2-block-privileged
  annotations:
    policies.kyverno.io/title: Disallow privileged containers
    policies.kyverno.io/category: Pod Security Standards (Baseline)
    policies.kyverno.io/severity: high
spec:
  validationFailureAction: Audit
  background: true
  rules:
    - name: block-privileged
      match:
        any:
          - resources:
              kinds: [Pod]
      exclude:
        any:
          - resources:
              namespaces: [kube-system, kube-public, kube-node-lease, kyverno]
      validate:
        message: "Privileged containers are prohibited"
        pattern:
          spec:
            =(ephemeralContainers):
              - =(securityContext):
                  =(privileged): "false"
            =(initContainers):
              - =(securityContext):
                  =(privileged): "false"
            containers:
              - =(securityContext):
                  =(privileged): "false"
