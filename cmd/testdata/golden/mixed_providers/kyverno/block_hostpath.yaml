# NIS2/DORA remediation: disallow hostPath volumes (CIS Kubernetes pod security).
# Needs Kyverno 1.17 or later. Starts in Audit mode. Review the policy reports, then change validationActions to Deny.
# Generated for: nis2demo/bad-hostpath
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: nis2-block-hostpath
  annotations:
    policies.kyverno.io/title: Disallow hostPath volumes
    policies.kyverno.io/category: Pod Security Standards (Baseline)
    policies.kyverno.io/severity: medium
spec:
  validationActions: [Audit]
  evaluation:
    background:
      enabled: true
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["pods"]
  matchConditions:
    - name: skip-system-namespaces
      expression: "!(object.metadata.namespace in ['kube-system', 'kube-public', 'kube-node-lease', 'kyverno'])"
  variables:
    - name: volumes
      expression: "object.spec.?volumes.orValue([])"
  validations:
    - expression: "variables.volumes.all(v, !has(v.hostPath))"
      message: "hostPath volumes are prohibited"
